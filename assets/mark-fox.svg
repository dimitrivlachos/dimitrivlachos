<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 196" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <!-- Geometric line-art fox head. Amber to match the header card;
       a construction deliberately unlike a filled polygon fox
       (open facet strokes, negative-space muzzle, no halo). -->

  <!-- Ears -->
  <path d="M62 14 L96 48 L74 58 Z" stroke="#ffb454" stroke-width="2.6"/>
  <path d="M138 14 L104 48 L126 58 Z" stroke="#ffb454" stroke-width="2.6"/>
  <path d="M69 24 L90 49 L77 55 Z" fill="#ffd27a" opacity="0.9"/>
  <path d="M131 24 L110 49 L123 55 Z" fill="#ffd27a" opacity="0.9"/>

  <!-- Head outline: shield narrowing to the nose -->
  <path d="M74 58 L96 48 L100 60 L104 48 L126 58 L140 88 L124 106 L112 132 L100 152 L88 132 L76 106 L60 88 Z"
        stroke="#ffb454" stroke-width="2.8"/>

  <!-- Facet strokes for the low-poly read -->
  <path d="M100 60 L100 104 M60 88 L84 96 M140 88 L116 96" stroke="#ffb454" stroke-width="1.6" opacity="0.55"/>

  <!-- Muzzle as amber-outlined negative space -->
  <path d="M84 104 L116 104 L108 134 L100 148 L92 134 Z" stroke="#ffb454" stroke-width="2"/>

  <!-- Nose -->
  <path d="M94 122 L106 122 L100 132 Z" fill="#e0872f"/>

  <!-- Closed happy eyes -->
  <path d="M72 92 Q80 86 88 92" stroke="#ffb454" stroke-width="2.4"/>
  <path d="M112 92 Q120 86 128 92" stroke="#ffb454" stroke-width="2.4"/>

  <!-- Tear-line hints -->
  <path d="M83 94 L90 110 M117 94 L110 110" stroke="#e0872f" stroke-width="1.6" opacity="0.7"/>

  <!-- Cheek spots -->
  <circle cx="67" cy="99" r="2.1" fill="#e0872f"/>
  <circle cx="72" cy="109" r="1.8" fill="#e0872f"/>
  <circle cx="133" cy="99" r="2.1" fill="#e0872f"/>
  <circle cx="128" cy="109" r="1.8" fill="#e0872f"/>

  <!-- Cyan glints, tying to the card's spotfinder colour -->
  <circle cx="86" cy="90" r="1.7" fill="#56d4dd"/>
  <circle cx="114" cy="90" r="1.7" fill="#56d4dd"/>
</svg>
